name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # 0.2.1 shipped a POSIX-only bug because every test base was a Windows path.
    # The fixtures now cover both families, and this matrix covers the filesystem
    # differences the fixtures cannot: rename over an open file, chmod, mode bits
    # and macOS's case-insensitive volumes.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # Report-only: the number is a baseline to compare against, not a gate.
      # A threshold set before the window handlers had tests would just be met
      # by the pure modules and hide the untested part.
      - name: Coverage
        if: runner.os == 'Linux'
        run: npm run test:coverage
