name: Publish

# Trusted publishing: no token, no OTP. npm trusts this workflow through OIDC
# and attaches a provenance attestation automatically.
#
# One-time setup on npmjs.com (after the first manual release):
#   Package → Settings → Trusted Publishing → GitHub Actions
#   owner: cheejiayuan512, repo: opencode-file-editor, workflow: publish.yml
#   allow "npm publish"
#
# Until that exists this workflow fails with ENEEDAUTH; it only runs on tags.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # Retagging or re-running a release must not fail on an existing version.
      - name: Publish if this version is new
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published; nothing to do."
            exit 0
          fi
          npm publish --provenance --access public
