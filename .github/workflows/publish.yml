name: Publish

# Trusted publishing: no token, no OTP. npm trusts this workflow through OIDC
# and attaches a provenance attestation automatically.
#
# One-time setup on npmjs.com (after the first manual release):
#   Package → Settings → Trusted Publishing → GitHub Actions
#   owner: cheejiayuan512, repo: opencode-file-editor, workflow: publish.yml
#   allow "npm publish"
#
# Until that exists this workflow fails with ENEEDAUTH; it only runs on tags.
#
# Every v* tag also gets a GitHub Release, so the Releases card never lags
# behind npm again. Re-running the workflow is safe: an existing release is
# left untouched.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  id-token: write
  # Creating the GitHub Release writes to the repository's releases.
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # Retagging or re-running a release must not fail on an existing version.
      - name: Publish if this version is new
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published; nothing to do."
            exit 0
          fi
          npm publish --provenance --access public

      # Only tags name a release; workflow_dispatch runs from a branch.
      - name: Create the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to do."
            exit 0
          fi
          gh release create "$tag" --title "$tag" --generate-notes
