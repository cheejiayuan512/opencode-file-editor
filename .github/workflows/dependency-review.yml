name: Dependency review

# Dependabot opens the pull request; this says whether the new version is
# safe before a human or a merge queue looks at it. It only runs on PRs.
on: pull_request

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
